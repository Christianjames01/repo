$kind: http-request
name: New Request
url: http://localhost/barangaylink1/modules/auth/login.php
method: POST
order: 1773303300174
headers:
  Content-Type: application/json
body:
  type: urlencoded
  content:
    username: ""
    password: ""
scripts:
  - type: afterResponse
    code: |-
      // Basic tests
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is acceptable", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      // Visualization template
      var template = `
      <canvas id="responseChart" height="100"></canvas>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.5.0/Chart.min.js"></script>
      <script>
          var ctx = document.getElementById("responseChart");
          var myChart = new Chart(ctx, {
              type: "bar",
              data: {
                  labels: [],
                  datasets: [{
                      label: "Response Metrics",
                      data: [],
                      backgroundColor: [
                          "rgba(54, 162, 235, 0.7)",
                          "rgba(255, 99, 132, 0.7)",
                          "rgba(255, 206, 86, 0.7)",
                          "rgba(75, 192, 192, 0.7)",
                          "rgba(153, 102, 255, 0.7)",
                          "rgba(255, 159, 64, 0.7)"
                      ],
                      borderColor: [
                          "rgba(54, 162, 235, 1)",
                          "rgba(255, 99, 132, 1)",
                          "rgba(255, 206, 86, 1)",
                          "rgba(75, 192, 192, 1)",
                          "rgba(153, 102, 255, 1)",
                          "rgba(255, 159, 64, 1)"
                      ],
                      borderWidth: 1
                  }]
              },
              options: {
                  legend: { display: true },
                  title: {
                      display: true,
                      text: "Response Analysis"
                  },
                  scales: {
                      yAxes: [{
                          ticks: { beginAtZero: true },
                          scaleLabel: {
                              display: true,
                              labelString: "Count / Value"
                          }
                      }],
                      xAxes: [{
                          scaleLabel: {
                              display: true,
                              labelString: "Metric"
                          }
                      }]
                  }
              }
          });

          pm.getData(function (err, value) {
              myChart.data.labels = value.labels;
              myChart.data.datasets[0].data = value.data;
              myChart.data.datasets[0].label = value.chartTitle;
              myChart.options.title.text = value.chartTitle;
              myChart.update();
          });
      </script>
      `;

      function constructVisualizerPayload() {
          var responseText = pm.response.text();
          var labels = [];
          var data = [];
          var chartTitle = "Response Analysis";
          
          // Try to parse as JSON first
          try {
              var jsonData = pm.response.json();
              // If JSON, extract numeric fields
              var numericFields = [];
              for (var key in jsonData) {
                  if (typeof jsonData[key] === "number") {
                      numericFields.push({ key: key, value: jsonData[key] });
                  }
              }
              if (numericFields.length > 0) {
                  chartTitle = "JSON Numeric Fields";
                  for (var i = 0; i < numericFields.length; i++) {
                      labels.push(numericFields[i].key);
                      data.push(numericFields[i].value);
                  }
                  return { labels: labels, data: data, chartTitle: chartTitle };
              }
          } catch (e) {
              // Not JSON, continue to HTML analysis
          }
          
          // HTML response - extract metrics
          chartTitle = "HTML Response Metrics";
          
          var totalLength = responseText.length;
          var divCount = (responseText.match(/<div/gi) || []).length;
          var scriptCount = (responseText.match(/<script/gi) || []).length;
          var linkCount = (responseText.match(/<link/gi) || []).length;
          var formCount = (responseText.match(/<form/gi) || []).length;
          var inputCount = (responseText.match(/<input/gi) || []).length;
          
          labels = ["Length (÷100)", "<div>", "<script>", "<link>", "<form>", "<input>"];
          data = [Math.round(totalLength / 100), divCount, scriptCount, linkCount, formCount, inputCount];
          
          return { labels: labels, data: data, chartTitle: chartTitle };
      }

      pm.visualizer.set(template, constructVisualizerPayload());
